# The one manifest for both halves of fleet-view: the Go process in main.go and
# the browser bundle under ui/.
#
# The namespace is absent on purpose. The host derives it from the repository
# address the operator installed: com.github.aux.jakubdotpy.connect-fleet-view.

name: fleet-view
# The kind the one instance is declared under. It offers the service runtime,
# which is what a module with a process needs. The browser half is declared
# beside it, as `service.assets`.
kind: sink
version: 0.3.0
license: MIT
title: Fleet View
summary: >-
  Your print farm the way it stands in the room: racks on a floor plan, shelves in each rack, and every printer live
  in its slot with the print's picture, progress, time left and state. Printers that need you light up, so a run-out
  spool or a heater fault is spotted from across the room. Select one printer, a shelf or a whole rack and pause,
  resume, stop, preheat, cool down, home or set them ready at once; lay out the farm by drag and drop, share one
  layout with everyone, keep it in YAML, and pin any rack to a dashboard.
codeowner: jakubdotpy
# The module wire major the process half speaks.
contract_major: 1
# Where the fragment describing the routes is, inside this repository.
openapi: openapi.json
# The platforms the release ships a binary for, each a GOOS_GOARCH pair.
platforms:
  - linux_amd64
  - linux_arm64
  - darwin_arm64
  - windows_amd64

require:
  core: ">=0.1.0-beta.2"

# A directory of its own, where the shared floor plan is kept as layout.json.
needs:
  data: true

# No permissions and no events: the module acts only for the person the host
# authorized, and does nothing of its own.

ui:
  # The built bundle's entry, relative to the bundle root. The host serves it
  # at /api/v1/modules/com.github.aux.jakubdotpy.connect-fleet-view/ui/ui/index.js.
  entry: ui/index.js
  # The range of @prusa/connect-ui this bundle was built against. The app
  # refuses a bundle its own version falls outside of.
  library: ">=0.0.1 <1.0.0"
  contributes:
    # The whole of what this bundle may register. A registration the block
    # does not declare is refused at run time and the app drops this module.
    # Every entry here has one `host.register` call behind it in
    # ui/src/index.ts, and the generator wrote the pair from one answer.
    pages:
      - path: fleet-view
        title: Fleet View
    # One rack's front view on a dashboard, for selecting it, a shelf or a
    # printer and sending commands. The rack is picked by the card's own editor,
    # because the schema has no kind for a rack of this module.
    cards:
      - id: rack
        title: Rack
        description: One rack from the front, every printer's state and progress live, with batch control for a shelf or the whole rack.
        icon: layers
        size: {w: 6, h: 5}
        least: {w: 3, h: 3}
        settings:
          - key: rack
            kind: text
            label: Rack
            max_bytes: 128
            default: ""
          - key: name
            kind: text
            label: Rack name
            max_bytes: 256
            default: ""
