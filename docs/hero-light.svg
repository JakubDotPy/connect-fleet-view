<text x="68" y="292" font-size="84" class="bb txt" letter-spacing="-2.5">Fleet View</text>
<text class="muted" font-size="23"><tspan x="72" y="346">Your print farm as racks, shelves</tspan><tspan x="72" y="378">and slots. Select any of them and</tspan><tspan x="72" y="410">command them at once.</tspan></text>

