<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
<title id="t">Fleet View</title>
<desc id="d">A print farm floor plan seen from above; one rack pulled out into its front view with shelf 2 selected and a selection pill offering Pause and Preheat for its four printers.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ececee"/><stop offset="1" stop-color="#f6f6f7"/></linearGradient>
<radialGradient id="glow" cx="0.72" cy="0.62" r="0.55"><stop offset="0" stop-color="#FA6831" stop-opacity="0.10"/><stop offset="1" stop-color="#FA6831" stop-opacity="0"/></radialGradient>
