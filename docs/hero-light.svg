<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d9dadd"/></pattern>
<filter id="lift" x="-20%" y="-60%" width="140%" height="240%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.16"/></filter>
</defs>
